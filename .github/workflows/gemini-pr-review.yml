name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lấy nội dung Git Diff của PR
        id: get_diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          head -c 60000 pr_diff.txt > diff_trimmed.txt

      - name: Phân tích chuyên sâu với Gemini
        id: gemini_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Chưa tìm thấy GEMINI_API_KEY trong GitHub Secrets." > review_comment.md
            exit 0
          fi

          DIFF_CONTENT=$(cat diff_trimmed.txt)
          if [ -z "$DIFF_CONTENT" ]; then
            echo "### 🤖 Gemini Review: PR này không có thay đổi code nào." > review_comment.md
            exit 0
          fi

          PROMPT="Bạn là Giám đốc Kỹ thuật kiêm Lead Creative Developer cho một web âm nhạc chuẩn Awwwards.
Nhiệm vụ của bạn là review thật chi tiết, có tâm, giải thích bình dân và chỉ rõ rủi ro cho dev hiểu.

Hãy phân tích kỹ đoạn Git Diff sau theo đúng cấu trúc 4 phần:
1. 🎯 TỔNG QUAN THAY ĐỔI: Tóm tắt dễ hiểu commit này đang muốn làm gì, tác động đến luồng nào trong app.
2. 🔍 SOI KỸ THUẬT & BẮT LỖI SÂU:
   - Hiệu năng & Rò rỉ bộ nhớ: Có bỏ quên cleanup trong useEffect, requestAnimationFrame, hay rò rỉ AudioContext không?
   - Rủi ro sập luồng: API có được bọc try/catch cẩn thận không? Có nguy cơ làm nghẽn main thread gây giật âm thanh không?
   - Type Safety: Có ép kiểu 'any' bừa bãi hay thiếu validate dữ liệu không?
3. 🛠️ GỢI Ý CẢI THIỆN: Nếu có chỗ chưa tối ưu, hãy viết luôn đoạn code mẫu (TypeScript/JS) để sửa ngay.
4. 🚦 KẾT LUẬN & ĐIỂM SỐ: 
   - Đánh giá độ sẵn sàng (Thang điểm 1-10).
   - Chốt hạ rõ ràng: [MERGE NGAY] hoặc [CẦN SỬA LẠI TRƯỚC KHI MERGE].

Nội dung Git Diff:
"

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg diff "$DIFF_CONTENT" \
            '{contents: [{parts: [{text: ($prompt + "\n\n```diff\n" + $diff + "\n```")}]}]}')

          call_api() {
            local model=$1
            curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          }

          # Thử 3.8 Flash trước, nếu quá tải (503/429) tự động nhảy sang 3.7 Flash
          MODEL_USED="gemini-3.8-flash"
          RES=$(call_api "$MODEL_USED")
          STATUS=$(echo "$RES" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          BODY=$(echo "$RES" | sed -e 's/HTTP_STATUS\:.*//g')

          if [ "$STATUS" != "200" ]; then
            MODEL_USED="gemini-3.7-flash"
            RES=$(call_api "$MODEL_USED")
            STATUS=$(echo "$RES" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
            BODY=$(echo "$RES" | sed -e 's/HTTP_STATUS\:.*//g')
          fi

          REVIEW_TEXT=$(echo "$BODY" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            ERR=$(echo "$BODY" | jq -r '.error.message // "Không xác định"')
            echo "### ⚠️ Lỗi khi gọi Gemini API ($STATUS)" > review_comment.md
            echo "Chi tiết: $ERR" >> review_comment.md
          else
            echo "### 🤖 Báo Cáo Thẩm Định Code (Gemini Engine: \`$MODEL_USED\`)" > review_comment.md
            echo "" >> review_comment.md
            echo "$REVIEW_TEXT" >> review_comment.md
          fi

      - name: Bình luận vào PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

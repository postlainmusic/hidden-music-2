name: Production Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'fix: run production repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply safe production fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/api/src/index.ts')
          s = p.read_text()

          old = 'const JWT_SECRET_FALLBACK = "default_vault_jwt_secret_key_change_in_production";\n'
          s = s.replace(old, '')
          old = '''function getJwtSecret(env: Bindings): string {\n  return env?.JWT_SECRET || JWT_SECRET_FALLBACK;\n}'''
          new = '''function getJwtSecret(env: Bindings): string {\n  const secret = env?.JWT_SECRET;\n  if (!secret || secret.length < 32) {\n    throw new Error("JWT_SECRET is required and must be at least 32 characters");\n  }\n  return secret;\n}'''
          if old in s:
              s = s.replace(old, new)
          else:
              raise SystemExit('JWT helper pattern not found')

          old = '''app.post("/api/admin/seed", async (c) => {\n  if (!c.env.DB) return c.json({ success: false, error: "Database not connected" }, 500);'''
          new = '''app.post("/api/admin/seed", async (c) => {\n  const guard = await requireAdmin(c);\n  if (guard) return guard;\n  if (!c.env.DB) return c.json({ success: false, error: "Database not connected" }, 500);'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('admin seed pattern not found')

          p.write_text(s)

          p = Path('apps/web/src/audio/DualDeckAudioEngine.ts')
          s = p.read_text()
          old = '''    this.currentTrack = track;\n    this.trackStartedAt = Date.now();\n    this.retryCount = 0;'''
          new = '''    const previousTrack = this.currentTrack;\n    const wasPlaying = this.isPlaying;\n    const useCrossfade = (options.crossfade ?? true) && wasPlaying && !!previousTrack && previousTrack.id !== track.id;\n\n    this.currentTrack = track;\n    this.trackStartedAt = Date.now();\n    this.retryCount = 0;'''
          if old not in s:
              raise SystemExit('audio state pattern not found')
          s = s.replace(old, new, 1)
          old = '''    const useCrossfade = (options.crossfade ?? true) && this.isPlaying && (this.currentTrack?.id !== track.id);\n\n    // Determine target deck'''
          new = '''    // Determine target deck'''
          if old not in s:
              raise SystemExit('audio crossfade pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          npm ci --ignore-scripts
          npm run build:web
          npm test

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/index.ts apps/web/src/audio/DualDeckAudioEngine.ts
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: harden auth and audio crossfade'
          git push

name: Trigger Production Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trigger:
    if: github.actor != 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'fix: run production repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repair script
        shell: bash
        run: |
          set -euo pipefail
          echo 'Repair workflow trigger reached successfully.'

name = "hidden-music-api"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "hidden-music-jwt-secret-vault-2026"
CORS_ORIGIN = "https://hidden-music-web.pages.dev"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "hidden_music_db"
database_id = "bc9d31f0-e706-4f6c-924d-4b6243d9e6c4"

# Cloudflare R2 Storage Bucket Binding (Music Tracks & 3D GLB Models)
[[r2_buckets]]
binding = "MUSIC_ASSETS"
bucket_name = "hidden-music-vault"

# Workers Observability & Real-time Logs
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
